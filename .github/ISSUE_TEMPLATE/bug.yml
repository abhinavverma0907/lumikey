name: Bug report
description: Something isn't working
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `lumikey doctor`
      render: text
  - type: textarea
    id: log
    attributes:
      label: Service log
      description: "`journalctl --user -u lumikey -n 50`"
      render: text
  - type: input
    id: distro
    attributes:
      label: Distro and desktop
      placeholder: e.g. CachyOS, Hyprland
