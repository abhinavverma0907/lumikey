[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "lumikey"
dynamic = ["version"]
description = "Animated, music- and typing-reactive RGB for Dynamic Lighting (HID LampArray) keyboards on Linux"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["numpy"]
keywords = ["rgb", "keyboard", "lighting", "dynamic lighting", "lamparray", "hid", "linux", "gtk"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: GTK",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Hardware",
]

[project.optional-dependencies]
gui = ["PyGObject"]

[project.scripts]
lumikey = "lumikey.core:main"

[project.gui-scripts]
lumikey-gui = "lumikey.gui:main"

[project.urls]
Homepage = "https://github.com/abhinavverma0907/lumikey"
Issues = "https://github.com/abhinavverma0907/lumikey/issues"

[tool.setuptools]
packages = ["lumikey"]

[tool.setuptools.dynamic]
version = { attr = "lumikey.__version__" }

[tool.setuptools.package-data]
lumikey = ["data/*"]
